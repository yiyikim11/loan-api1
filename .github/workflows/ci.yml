# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:          # also run on every pull request

jobs:
  test:
    runs-on: ubuntu-latest         # a fresh GitHub-hosted Linux machine for each run
    steps:
      - uses: actions/checkout@v7  # get the repository's code
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip               # reuse downloaded packages between runs
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train the model the tests load
        run: python train.py
      - name: Run tests
        run: pytest -v
